# Conda environment for Jupyter_in_Teaching_FEM_and_PINNs.ipynb
# Create with:  conda env create -f environment.yml
# Activate:     conda activate jshare
name: jshare
channels:
  - conda-forge
dependencies:
  - python=3.11
  - numpy
  - scipy
  - matplotlib
  - jupyterlab
  - ipykernel
  - pandas
  - ipywidgets
  - pip
  - pip:
      - torch      # PyTorch is installed from PyPI (CPU build is enough)
